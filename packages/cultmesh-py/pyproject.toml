[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cultmesh-py"
version = "0.1.0"
description = "Python CultMesh node, discovery, sessions, and local server for GameCult typed state."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "GameCult" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["cultcache-py>=0.2.0", "cultnet-py>=0.1.0"]
[project.scripts]
cultmesh-py-daemon = "cultmesh_py.daemon:main"
cultmesh-py-verify = "cultmesh_py.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cultmesh_py = ["py.typed"]
