[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cultnet-py"
version = "0.1.0"
description = "Python CultNet transport, wire contracts, and replication for GameCult typed state."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "GameCult" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["cultcache-py>=0.2.0", "msgpack>=1.0"]
[project.optional-dependencies]
crypto = ["cryptography>=42"]

[project.scripts]
cultnet-py-interop = "cultnet_py.interop_peer:main"
cultnet-py-benchmark = "cultnet_py.benchmark:main"
cultnet-py-compare-csharp = "cultnet_py.compare_csharp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cultnet_py = ["py.typed"]
