[package]
name = "cultmesh-rs"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "cultmesh_rs"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
cultcache-rs = { path = "../cultcache-rs" }
cultnet-rs = { path = "../cultnet-rs" }
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
rmp-serde = "1"
serde_json = "1"
tempfile = "3"
