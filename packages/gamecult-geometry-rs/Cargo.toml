[package]
name = "gamecult-geometry"
version = "0.1.0"
edition = "2024"
description = "GameCult.Geometry typed contracts and geometry runtime for Rust"
license = "MIT"
repository = "https://github.com/GameCult/CultLib"
readme = "README.md"

[dependencies]
bevy_math = "0.17"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
approx = "0.5"
